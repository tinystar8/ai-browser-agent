<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser agent</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Georgia, "Iowan Old Style", serif;
      background: #141414;
      color: #f2f2f2;
    }
    header {
      flex: none;
      padding: 16px 20px 8px;
      border-bottom: 1px solid #2a2a2a;
    }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    #modes { display: flex; gap: 8px; margin-bottom: 8px; }
    #modes button {
      background: #242424;
      color: #f2f2f2;
    }
    #modes button.selected {
      background: #f2f2f2;
      color: #141414;
    }
    #status, #skills, #commands { color: #a3a3a3; font-family: ui-sans-serif, sans-serif; font-size: 14px; }
    #commands {
      margin: 8px 0 0;
      white-space: pre-wrap;
      max-height: 9em;
      overflow: auto;
    }
    #commands[hidden] { display: none; }
    #skills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    #skills button {
      padding: 6px 10px;
      background: #242424;
      color: #f2f2f2;
      font-weight: 500;
    }
    #editor {
      flex: none;
      max-height: 48vh;
      overflow: auto;
      padding: 12px 20px 16px;
      border-bottom: 1px solid #2a2a2a;
      background: #101010;
    }
    #editor[hidden] { display: none; }
    #editor h2 { margin: 0 0 8px; font-size: 16px; }
    #editor label {
      display: block;
      margin: 8px 0 4px;
      color: #a3a3a3;
      font-family: ui-sans-serif, sans-serif;
      font-size: 13px;
    }
    #editor input, #editor textarea { width: 100%; box-sizing: border-box; }
    #editor textarea { min-height: 140px; }
    #editor .actions { display: flex; gap: 8px; margin-top: 10px; }
    #skill-note { color: #86efac; font-family: ui-sans-serif, sans-serif; font-size: 13px; }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px 8px;
    }
    .row { display: flex; margin: 8px 0; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: min(720px, 80%);
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
      font-family: ui-sans-serif, sans-serif;
      font-size: 15px;
    }
    .bubble img {
      display: block;
      max-width: 100%;
      max-height: 240px;
      margin-top: 8px;
      border-radius: 6px;
    }
    .user .bubble { background: #1d4ed8; }
    .agent .bubble { background: #242424; }
    form {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 20px 16px;
      border-top: 1px solid #2a2a2a;
    }
    #previews { display: flex; gap: 8px; flex-wrap: wrap; }
    #previews:empty { display: none; }
    .preview {
      position: relative;
    }
    .preview img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .preview button {
      position: absolute;
      top: 2px;
      right: 2px;
      padding: 0 6px;
      background: #141414;
      color: #f2f2f2;
    }
    .composer { display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      resize: none;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a3a3a;
      background: #101010;
      color: #f2f2f2;
      font: 16px ui-monospace, ui-sans-serif, monospace;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #f2f2f2;
      color: #141414;
      font: 600 15px ui-sans-serif, sans-serif;
      cursor: pointer;
    }
    #file { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Browser agent</h1>
    <div id="modes">
      <button type="button" data-mode="auto" class="selected">Auto</button>
      <button type="button" data-mode="manual">Manual</button>
      <button type="button" id="add-skill">Add skill</button>
    </div>
    <div id="status">Checking the agent…</div>
    <pre id="commands" hidden></pre>
    <div id="skills">Skills load with the chat.</div>
  </header>
  <section id="editor" hidden>
    <h2>Edit skill</h2>
    <input id="skill-current" type="hidden">
    <input id="skill-validate" type="hidden">
    <input id="skill-fetch" type="hidden">
    <label for="skill-name">Name</label>
    <input id="skill-name" autocomplete="off">
    <label for="skill-description">Description</label>
    <input id="skill-description" autocomplete="off">
    <label for="skill-args">Arguments, separated by commas. Use {argument} in the prompt.</label>
    <input id="skill-args" autocomplete="off">
    <label for="skill-body">Prompt</label>
    <textarea id="skill-body" rows="8"></textarea>
    <div class="actions">
      <button type="button" id="skill-save">Save</button>
      <button type="button" id="skill-close">Close</button>
      <span id="skill-note"></span>
    </div>
  </section>
  <div id="log"></div>
  <form id="form">
    <div id="previews"></div>
    <div class="composer">
      <button type="button" id="attach">Picture</button>
      <textarea id="text" rows="2" placeholder="Tell the agent what to do. Shift+Enter adds a line."></textarea>
      <button type="submit">Send</button>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
  </form>
  <script>
    const log = document.querySelector("#log");
    const status = document.querySelector("#status");
    const form = document.querySelector("#form");
    const text = document.querySelector("#text");
    const file = document.querySelector("#file");
    const previews = document.querySelector("#previews");
    const modeButtons = document.querySelectorAll("#modes button[data-mode]");
    let lastId = 0;
    let stickToBottom = true;
    let mode = "auto";
    let skillKeyShown = "";
    const pictures = [];

    function atBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 64;
    }

    log.addEventListener("scroll", () => {
      stickToBottom = atBottom();
    });

    function addRow(role, body, images) {
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "agent");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (body) bubble.textContent = body;
      for (const src of images || []) {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Attached picture";
        bubble.appendChild(img);
      }
      row.appendChild(bubble);
      log.appendChild(row);
    }

    function showSkills(skills) {
      const key = skills.map((skill) => skill.name + (skill.description || "")).join("|");
      const box = document.querySelector("#skills");
      if (key === skillKeyShown && box.querySelector("button")) return;
      skillKeyShown = key;
      box.replaceChildren();
      if (!skills.length) {
        box.textContent = "No skills yet. Finish a task, then send Add skill.";
        return;
      }
      const label = document.createElement("span");
      label.textContent = "Skills";
      box.appendChild(label);
      for (const skill of skills) {
        const button = document.createElement("button");
        button.type = "button";
        const args = skill.args && skill.args.length ? " " + skill.args.join(" ") : "";
        button.textContent = skill.name + args;
        button.title = skill.description || skill.name;
        button.addEventListener("click", () => openSkill(skill.name));
        box.appendChild(button);
      }
    }

    async function openSkill(name) {
      const response = await fetch("/skills/" + encodeURIComponent(name));
      if (!response.ok) {
        document.querySelector("#skill-note").textContent = "That skill could not be opened.";
        return;
      }
      const skill = await response.json();
      document.querySelector("#editor").hidden = false;
      document.querySelector("#skill-current").value = skill.name;
      document.querySelector("#skill-name").value = skill.name;
      document.querySelector("#skill-description").value = skill.description || "";
      document.querySelector("#skill-args").value = (skill.args || []).join(", ");
      document.querySelector("#skill-validate").value = skill.validate || "";
      document.querySelector("#skill-fetch").value = skill.fetch || "";
      document.querySelector("#skill-body").value = skill.body || "";
      document.querySelector("#skill-note").textContent = "";
      document.querySelector("#skill-body").focus();
    }

    function showMode(next) {
      mode = next === "manual" ? "manual" : "auto";
      for (const button of modeButtons) {
        button.classList.toggle("selected", button.dataset.mode === mode);
      }
    }

    function placeholder(data) {
      if (mode === "manual") return "A command, or a question about the screen. Shift+Enter adds a line.";
      if (data.status === "waiting") return "Command the open window. Say close to close it.";
      if (data.status === "running" || data.status === "steering") return "The running task follows this next.";
      return "Tell the agent what to do. Shift+Enter adds a line.";
    }

    function paint(data) {
      showMode(data.mode);
      const prefix = mode === "manual" ? "Manual. " : "Auto. ";
      const label = data.status === "running" || data.status === "steering"
        ? "Running task " + (data.task_id ?? "")
        : data.status === "waiting"
          ? "Finished. The browser is still open. Send another instruction, or say close."
          : data.status === "idle"
            ? "Idle. A message starts a task."
            : "Last task " + (data.task_id ?? "") + " is " + data.status;
      status.textContent = prefix + label.trim();
      const commands = document.querySelector("#commands");
      if (data.mode === "manual" && data.commands) {
        commands.hidden = false;
        commands.textContent = data.commands;
      } else {
        commands.hidden = true;
      }
      showSkills(data.skills || []);
      text.placeholder = placeholder(data);
      const follow = stickToBottom;
      for (const message of data.messages) {
        if (message.id <= lastId) continue;
        addRow(message.role, message.text, message.images);
        lastId = message.id;
      }
      if (follow) log.scrollTop = log.scrollHeight;
    }

    async function refresh() {
      const response = await fetch("/chat");
      if (!response.ok) return;
      paint(await response.json());
    }

    function renderPreviews() {
      previews.replaceChildren();
      pictures.forEach((picture, index) => {
        const item = document.createElement("div");
        item.className = "preview";
        const img = document.createElement("img");
        img.src = picture;
        img.alt = "Picture to send";
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          pictures.splice(index, 1);
          renderPreviews();
        });
        item.append(img, remove);
        previews.appendChild(item);
      });
    }

    document.querySelector("#attach").addEventListener("click", () => file.click());
    file.addEventListener("change", () => {
      const chosen = Array.from(file.files || []);
      file.value = "";
      for (const item of chosen) {
        if (pictures.length >= 4) {
          status.textContent = "Attach up to 4 pictures.";
          break;
        }
        if (item.size > 4 * 1024 * 1024) {
          status.textContent = "Each picture must be under 4 MB.";
          continue;
        }
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === "string") pictures.push(reader.result);
          renderPreviews();
        };
        reader.readAsDataURL(item);
      }
    });

    document.querySelector("#skill-close").addEventListener("click", () => {
      document.querySelector("#editor").hidden = true;
      document.querySelector("#skill-note").textContent = "";
    });

    document.querySelector("#skill-save").addEventListener("click", async () => {
      const current = document.querySelector("#skill-current").value;
      const note = document.querySelector("#skill-note");
      const payload = {
        name: document.querySelector("#skill-name").value.trim(),
        description: document.querySelector("#skill-description").value,
        args: document.querySelector("#skill-args").value.split(",").map((item) => item.trim()).filter(Boolean),
        validate: document.querySelector("#skill-validate").value.trim(),
        fetch: document.querySelector("#skill-fetch").value.trim(),
        body: document.querySelector("#skill-body").value,
      };
      const response = await fetch("/skills/" + encodeURIComponent(current), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        note.textContent = detail.detail || "The skill could not be saved.";
        return;
      }
      const saved = await response.json();
      document.querySelector("#skill-current").value = saved.name;
      note.textContent = "Saved " + saved.name + ".";
      refresh();
    });

    document.querySelector("#add-skill").addEventListener("click", async () => {
      stickToBottom = true;
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Add skill", mode }),
      });
      if (response.ok) paint(await response.json());
    });

    for (const button of modeButtons) {
      button.addEventListener("click", async () => {
        const next = button.dataset.mode;
        showMode(next);
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: next }),
        });
        if (response.ok) paint(await response.json());
      });
    }

    text.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = text.value.trim();
      if (!message && pictures.length === 0) return;
      const images = pictures.splice(0, pictures.length);
      renderPreviews();
      text.value = "";
      stickToBottom = true;
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, mode, images }),
      });
      if (!response.ok) {
        pictures.unshift(...images);
        renderPreviews();
        text.value = message;
        status.textContent = "The picture could not be sent.";
        return;
      }
      paint(await response.json());
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
